  tenant_id: "tenant_legal_uk"
  metadata:
    title: "Commercial Lease Agreement - Mayfair Premises"
    doc_type: "contract"
    version: "2026.1"
  content: |
    COMMERCIAL LEASE AGREEMENT - SECTION 4: MAINTENANCE AND PROPERTY UPKEEP.
    The Landlord and Tenant agree to maintain the demised premises in good working order.
    The Landlord is generally responsible for the structural integrity of the building, exterior walls, roof, and major central mechanical systems including the primary HVAC boiler unit.
    The Tenant agrees to keep the internal premises clean and manage ordinary daily operational wear.
    SPECIFIC CLAUSE QUALIFIER (Section 4.3): However, the Tenant shall bear the full cost of routine servicing, maintenance, and filter replacements for any air conditioning or HVAC units installed within the leased space.

