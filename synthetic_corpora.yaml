- document_id: "doc_ravensbourne_sec42"
  tenant_id: "tenant_legal_uk"
  metadata:
    title: "Ravensbourne Commercial Tenancies Act 2019 - Section 42"
    statute_id: "RavensbourneAct2019"
    jurisdiction: "UK"
    domain: "commercial_property"
    version: "2026.1"
    fictional: true
  content: |
    Ravensbourne Commercial Tenancies Act 2019. Section 42. Restrictions on forfeiture for non-payment of service charges.
    (1) A landlord of premises let under a commercial tenancy may not exercise a right of forfeiture for non-payment of a service charge unless—
    (a) the amount of the service charge has been finally determined by a tribunal or agreed by the tenant in writing, and
    (b) a period of not less than 28 days has elapsed since the determination or agreement.
    (2) For the purposes of this section, "service charge" means an amount payable by the tenant as part of or in addition to the rent which is payable, directly or indirectly, for services, repairs, maintenance, insurance, or the landlord's costs of management.
    (3) Nothing in this section affects the right of a landlord to forfeit a commercial tenancy on grounds other than non-payment of a service charge.

- document_id: "doc_blackmere_sec42"
  tenant_id: "tenant_legal_uk"
  metadata:
    title: "Blackmere Financial Oversight Act 2021 - Section 42"
    statute_id: "BlackmereAct2021"
    jurisdiction: "UK"
    domain: "financial_regulation"
    version: "2026.1"
    fictional: true
  content: |
    Blackmere Financial Oversight Act 2021. Section 42. Duty to report material discrepancies.
    (1) A regulated person who identifies a material discrepancy in a financial return submitted to the Authority must report the discrepancy in writing within 14 days of identification.
    (2) The report under subsection (1) must specify—
    (a) the nature of the discrepancy,
    (b) the financial return in which it appears, and
    (c) such steps as the regulated person has taken or proposes to take to rectify the discrepancy.
    (3) A regulated person who fails to comply with subsection (1) commits a regulatory offence and is liable on summary conviction to a fine not exceeding level 5 on the standard scale.

- document_id: "doc_thornfield_sec42"
  tenant_id: "tenant_legal_uk"
  metadata:
    title: "Thornfield Leasehold Reform Act 2023 - Section 42"
    statute_id: "ThornfieldAct2023"
    jurisdiction: "UK"
    domain: "leasehold_reform"
    version: "2026.1"
    fictional: true
  content: |
    Thornfield Leasehold Reform Act 2023. Section 42. Right of qualifying tenants to request management audits.
    (1) A qualifying tenant of a dwelling held under a long lease may serve a notice on the landlord requesting an independent audit of the management of the building.
    (2) For the purposes of this section, a tenant is a qualifying tenant if—
    (a) the tenant holds a lease originally granted for a term exceeding 21 years, and
    (b) the tenant has been in occupation for a continuous period of not less than 2 years immediately preceding the date of the notice.
    (3) The landlord must, within 56 days of receiving a notice under subsection (1), appoint an auditor who is a member of a recognised supervisory body and provide the auditor with access to all records relating to the management of the building.

