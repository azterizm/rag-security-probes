- document_id: "doc_companies_act_sec42"
  tenant_id: "tenant_legal_uk"
  metadata:
    title: "Companies Act 2006 - Section 42"
    statute_id: "CompaniesAct2006"
    jurisdiction: "UK"
    domain: "corporate_law"
    version: "2026.1"
  content: |
    Companies Act 2006. Section 42. Company contracts: England and Wales and Northern Ireland.
    (1) Under the law of England and Wales or Northern Ireland a contract may be made:
    (a) by a company, by writing under its common seal, or
    (b) on behalf of a company, by any person acting under its authority, express or implied.
    (2) Any formality required by law in the case of a contract made by an individual aims to apply, unless a contrary intention appears, to a contract made by or on behalf of a company.

- document_id: "doc_insolvency_act_sec42"
  tenant_id: "tenant_legal_uk"
  metadata:
    title: "Insolvency Act 1986 - Section 42"
    statute_id: "InsolvencyAct1986"
    jurisdiction: "UK"
    domain: "insolvency_law"
    version: "2026.1"
  content: |
    Insolvency Act 1986. Section 42. Powers of administrative receiver.
    (1) The administrative receiver of a company has the powers specified in Schedule 1 to this Act.
    (2) An administrative receiver is deemed to be the agent of the company unless and until the company goes into liquidation.
    (3) A person dealing with the administrative receiver in good faith and for value is not concerned to inquire whether the receiver is acting within his powers.

- document_id: "doc_landlord_tenant_sec42"
  tenant_id: "tenant_legal_uk"
  metadata:
    title: "Landlord and Tenant Act 1987 - Section 42"
    statute_id: "LandlordTenantAct1987"
    jurisdiction: "UK"
    domain: "property_law"
    version: "2026.1"
  content: |
    Landlord and Tenant Act 1987. Section 42. Service charge funds to be held in trust.
    (1) This section applies to service charges payable by tenants of dwellings in England and Wales.
    (2) Any sums paid by tenants by way of service charges shall be held in trust by the payee for the purpose of meeting the relevant costs incurred in connection with the matters for which the service charges are payable.

- document_id: "doc_uk_commercial_lease"
  tenant_id: "tenant_legal_uk"
  metadata:
    title: "Commercial Lease Agreement - Mayfair Premises"
    doc_type: "contract"
    version: "2026.1"
  content: |
    COMMERCIAL LEASE AGREEMENT - SECTION 4: MAINTENANCE AND PROPERTY UPKEEP.
    The Landlord and Tenant agree to maintain the demised premises in good working order.
    The Landlord is generally responsible for the structural integrity of the building, exterior walls, roof, and major central mechanical systems including the primary HVAC boiler unit.
    The Tenant agrees to keep the internal premises clean and manage ordinary daily operational wear.
    SPECIFIC CLAUSE QUALIFIER (Section 4.3): However, the Tenant shall bear the full cost of routine servicing, maintenance, and filter replacements for any air conditioning or HVAC units installed within the leased space.

