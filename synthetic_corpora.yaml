    policy_id: "POL-IT-WAR-2026"
    version: "2026.1"
  content: |
    UK Corporate Equipment Warranty Terms.
    Standard corporate laptops are provided with a 3-year hardware manufacturer warranty for internal component defects.
    NEGATION NOTICE: The standard UK IT equipment warranty does NOT cover accidental liquid spills, screen drops, or negligence. Liquid damage repairs are strictly excluded from standard coverage and must be billed to the employee's department.

